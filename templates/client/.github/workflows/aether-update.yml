name: Update Aether platform

on:
  workflow_dispatch:
  repository_dispatch:
    types: [aether-release]

permissions:
  contents: write
  pull-requests: write
  packages: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Platform updates are validated in develop before they can reach the
      # production branch. Existing client customizations are never overwritten.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: develop
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@aether-commerce"
      - name: Update Aether packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.AETHER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.AETHER_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm update --recursive --latest "@aether-commerce/*"
          pnpm aether:migrations
          pnpm validate
      - name: Open update pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Already using the latest Aether release."
            exit 0
          fi
          branch="automation/aether-update-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add package.json pnpm-lock.yaml apps database/migrations
          git commit -m "chore: update Aether platform packages"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" --title "chore: update Aether platform" --body "Automated Aether package and D1 migration update. Validation passed before this pull request was opened."
