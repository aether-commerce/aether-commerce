name: Prepare Aether package release

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aether-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.AETHER_RELEASE_TOKEN || github.token }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 8.15.9
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Require release bot token
        env:
          AETHER_RELEASE_TOKEN: ${{ secrets.AETHER_RELEASE_TOKEN }}
        run: |
          if [ -z "$AETHER_RELEASE_TOKEN" ]; then
            echo "::error::AETHER_RELEASE_TOKEN must be configured as a GitHub App or bot token before creating release PRs."
            exit 1
          fi
      - name: Create or update release PR
        uses: changesets/action@v1
        with:
          version: pnpm version:packages
          title: "chore: prepare Aether package release"
          commit: "chore: prepare Aether package release"
          createGithubReleases: false
          github-token: ${{ secrets.AETHER_RELEASE_TOKEN }}
