name: Publish Aether packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: aether-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 8.15.9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@aether-commerce"
      - run: pnpm install --frozen-lockfile
      - name: Detect package release
        id: release
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          pending_changeset="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending_changeset" ]; then
            echo "::error::Pending Changesets found on main. Prepare and merge the Changesets release PR from develop before promoting to main."
            exit 1
          elif printf '%s\n' "$changed" | grep -Eq '^packages/[^/]+/package\.json$'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build workspace
        if: ${{ steps.release.outputs.needed == 'true' }}
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - run: pnpm test:client-template
        if: ${{ steps.release.outputs.needed == 'true' }}
      - name: Verify package archives
        if: ${{ inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "${{ runner.temp }}/aether-packages"
      - name: Publish packages
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release tags
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: git push origin --tags
      - name: Notify Liminal client
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AETHER_CLIENT_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ vars.AETHER_CLIENT_REPOSITORY || 'aether-commerce/liminal-store' }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AETHER_CLIENT_DISPATCH_TOKEN is not configured; Dependabot remains the fallback."
            exit 0
          fi
          gh api --method POST "repos/${CLIENT_REPOSITORY}/dispatches" \
            -f event_type=aether-release \
            -f "client_payload[release_sha]=${RELEASE_SHA}" \
            -f "client_payload[source_repository]=${GITHUB_REPOSITORY}"
