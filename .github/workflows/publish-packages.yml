name: Publish Aether packages

on:
  workflow_run:
    workflows: ["Aether CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        required: false
        default: false
        type: boolean
      resume_release_sha:
        description: Resume manifest and client delivery for an already published main release SHA
        required: false
        type: string

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: aether-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.name == 'Aether CI' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
      - name: Authorize current package release SHA
        if: ${{ inputs.resume_release_sha == '' }}
        env:
          DEPLOY_TARGET_BRANCH: main
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-authorization.mjs
      - name: Authorize resumed package release SHA
        if: ${{ inputs.resume_release_sha != '' }}
        env:
          RELEASE_SHA: ${{ inputs.resume_release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-package-release-resume.mjs
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 8.15.9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@aether-commerce"
      - run: pnpm install --frozen-lockfile
      - name: Detect package release
        id: release
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
        shell: bash
        run: |
          changed="$(git diff --name-only "${RELEASE_SHA}^" "$RELEASE_SHA")"
          pending_changeset="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending_changeset" ]; then
            echo "::error::Pending Changesets found on main. Prepare and merge the Changesets release PR from develop before promoting to main."
            exit 1
          elif printf '%s\n' "$changed" | grep -Eq '^packages/[^/]+/package\.json$'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build workspace
        if: ${{ steps.release.outputs.needed == 'true' }}
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - run: pnpm test:client-template
        if: ${{ steps.release.outputs.needed == 'true' }}
      - name: Verify package archives
        if: ${{ inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "${{ runner.temp }}/aether-packages"
      - name: Publish packages
        if: ${{ !inputs.dry_run && inputs.resume_release_sha == '' && steps.release.outputs.needed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify package publication and ensure release tags
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if git cat-file -e "${RELEASE_SHA}^:$file" 2>/dev/null; then
              old_version="$(git show "${RELEASE_SHA}^:$file" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')"
            else
              old_version=""
            fi
            read -r name version < <(git show "${RELEASE_SHA}:$file" | node -e 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); console.log(p.name, p.version)')
            [ "$old_version" != "$version" ] || continue
            tag="${name}@${version}"
            published_version="$(npm view "${name}@${version}" version --registry https://npm.pkg.github.com)"
            if [ "$published_version" != "$version" ]; then
              echo "::error::Registry version mismatch for ${name}@${version}."
              exit 1
            fi
            remote_tag="$(git ls-remote origin "refs/tags/$tag")"
            if [ -n "$remote_tag" ]; then
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
            elif ! git show-ref --verify --quiet "refs/tags/$tag"; then
              git tag "$tag" "$RELEASE_SHA"
            fi
            if [ "$(git rev-list -n 1 "refs/tags/$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Release tag $tag does not point to the versioned main commit."
              exit 1
            fi
            if [ -z "$remote_tag" ]; then
              git push origin "refs/tags/$tag"
            fi
            echo "Verified ${name}@${version}; tag ${tag} points to ${RELEASE_SHA}."
            echo "- ${name}@${version}: registry verified; tag \`${tag}\` → \`${RELEASE_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          done < <(git diff --name-only "${RELEASE_SHA}^" "$RELEASE_SHA" -- 'packages/*/package.json')
      - name: Create and publish immutable release manifest
        id: manifest
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/aether-release-manifest/release-manifest.v1.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RELEASE_MANIFEST_PATH")"
          node scripts/create-release-manifest.mjs
          release_tag="aether-release-${RELEASE_SHA}"
          if ! gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_SHA" \
              --title "Aether release ${RELEASE_SHA:0:12}" \
              --notes "Immutable package, migration and client-contract manifest for ${RELEASE_SHA}."
          fi
          existing_dir="${RUNNER_TEMP}/existing-aether-release-manifest"
          mkdir -p "$existing_dir"
          if gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" --pattern release-manifest.v1.json --dir "$existing_dir" >/dev/null 2>&1; then
            if ! cmp -s "$RELEASE_MANIFEST_PATH" "$existing_dir/release-manifest.v1.json"; then
              echo "::error::The immutable release already has a different manifest asset."
              exit 1
            fi
          else
            gh release upload "$release_tag" "$RELEASE_MANIFEST_PATH" --repo "$GITHUB_REPOSITORY"
          fi
          manifest_sha256="$(sha256sum "$RELEASE_MANIFEST_PATH" | cut -d ' ' -f 1)"
          manifest_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${release_tag}/release-manifest.v1.json"
          {
            echo "manifest_tag=${release_tag}" >> "$GITHUB_OUTPUT"
            echo "manifest_sha256=${manifest_sha256}" >> "$GITHUB_OUTPUT"
            echo "manifest_url=${manifest_url}" >> "$GITHUB_OUTPUT"
          }
          {
            echo "## Aether package release manifest"
            echo "- Source: \`${RELEASE_SHA}\`"
            echo "- Manifest: [\`${release_tag}\`](${manifest_url})"
            echo "- SHA-256: \`${manifest_sha256}\`"
            node -e 'const m=require(process.argv[1]); for (const p of m.packages) console.log(`- ${p.name}@${p.version} — ${p.integrity}`)' "$RELEASE_MANIFEST_PATH"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify compatible Liminal updater
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AETHER_CLIENT_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ vars.AETHER_CLIENT_REPOSITORY || 'aether-commerce/liminal-store' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.resume_release_sha || github.sha }}
          RELEASE_MANIFEST_TAG: ${{ steps.manifest.outputs.manifest_tag }}
          RELEASE_MANIFEST_SHA256: ${{ steps.manifest.outputs.manifest_sha256 }}
          RELEASE_MANIFEST_URL: ${{ steps.manifest.outputs.manifest_url }}
          RELEASE_MANIFEST_PATH: ${{ runner.temp }}/aether-release-manifest/release-manifest.v1.json
          DISPATCH_PAYLOAD_PATH: ${{ runner.temp }}/aether-release-manifest/dispatch-payload.json
          AETHER_V1_CLIENT_UPDATES_ENABLED: ${{ vars.AETHER_V1_CLIENT_UPDATES_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$AETHER_V1_CLIENT_UPDATES_ENABLED" != "true" ]; then
            echo "Liminal v1 dispatch is disabled until its compatible consumer is integrated."
            echo "Client delivery: not activated; manifest is retained for a later safe resume." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AETHER_CLIENT_DISPATCH_TOKEN is required when v1 client delivery is enabled."
            exit 1
          fi
          node scripts/create-release-dispatch.mjs
          gh api --method POST "repos/${CLIENT_REPOSITORY}/dispatches" --input "$DISPATCH_PAYLOAD_PATH"
          echo "Client delivery: v1 dispatch sent to \`${CLIENT_REPOSITORY}\`." >> "$GITHUB_STEP_SUMMARY"
