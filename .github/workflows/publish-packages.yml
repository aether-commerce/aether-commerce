name: Publish Aether packages

on:
  workflow_run:
    workflows: ["Aether CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and pack without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: aether-package-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 8.15.9 }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@aether-commerce"
      - run: pnpm install --frozen-lockfile
      - name: Detect package release
        id: release
        shell: bash
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          pending_changeset="$(find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit)"
          if [ -n "$pending_changeset" ]; then
            echo "::error::Pending Changesets found on main. Prepare and merge the Changesets release PR from develop before promoting to main."
            exit 1
          elif printf '%s\n' "$changed" | grep -Eq '^packages/[^/]+/package\.json$'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build workspace
        if: ${{ steps.release.outputs.needed == 'true' }}
        env:
          NEXT_PUBLIC_AETHER_API_URL: https://api.example.com
          NEXT_PUBLIC_AETHER_AI_URL: https://ai.example.com
          NEXT_PUBLIC_PORTFOLIO_URL: https://portfolio.example.com
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
        run: pnpm build
      - run: pnpm test:client-template
        if: ${{ steps.release.outputs.needed == 'true' }}
      - name: Verify package archives
        if: ${{ inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: pnpm --filter "./packages/*" exec pnpm pack --pack-destination "${{ runner.temp }}/aether-packages"
      - name: Publish packages
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm publish:packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release tags
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            old_version="$(git show "HEAD^:$file" | node -e 'console.log(JSON.parse(require("fs").readFileSync(0, "utf8")).version)')"
            read -r name version < <(node -e 'const p = require(`./${process.argv[1]}`); console.log(p.name, p.version)' "$file")
            [ "$old_version" != "$version" ] || continue
            tag="${name}@${version}"
            if ! git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "::error::Missing release tag $tag after package publication."
              exit 1
            fi
            if [ "$(git rev-list -n 1 "refs/tags/$tag")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Release tag $tag does not point to the versioned main commit."
              exit 1
            fi
          done < <(git diff --name-only HEAD^ HEAD -- 'packages/*/package.json')
          git push origin --tags
      - name: Notify Liminal client
        if: ${{ !inputs.dry_run && steps.release.outputs.needed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.AETHER_CLIENT_DISPATCH_TOKEN }}
          CLIENT_REPOSITORY: ${{ vars.AETHER_CLIENT_REPOSITORY || 'aether-commerce/liminal-store' }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        shell: bash
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AETHER_CLIENT_DISPATCH_TOKEN is not configured; Dependabot remains the fallback."
            exit 0
          fi
          gh api --method POST "repos/${CLIENT_REPOSITORY}/dispatches" \
            -f event_type=aether-release \
            -f "client_payload[release_sha]=${RELEASE_SHA}" \
            -f "client_payload[source_repository]=${GITHUB_REPOSITORY}"
