name: Sync Aether main history

on:
  workflow_run:
    workflows: ["Aether CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aether-main-history-sync
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          token: ${{ secrets.AETHER_RELEASE_TOKEN || github.token }}
      - name: Verify the exact current main SHA and its successful push CI
        env:
          DEPLOY_TARGET_BRANCH: main
          EXPECTED_RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          UPSTREAM_WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.repository.full_name }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-deploy-authorization.mjs
      - name: Require release bot credential
        env:
          AETHER_RELEASE_TOKEN: ${{ secrets.AETHER_RELEASE_TOKEN }}
        run: test -n "$AETHER_RELEASE_TOKEN" || { echo '::error::AETHER_RELEASE_TOKEN is required.'; exit 1; }
      - name: Create or update history reconciliation PR
        env:
          GH_TOKEN: ${{ secrets.AETHER_RELEASE_TOKEN }}
          RELEASE_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: node scripts/sync-main-history.mjs
